; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Plain serial command protocol (cmdL/cmdR over UART). No agent required.
[env:esp32dev_serial]
extends = env

; Bypasses the python 3.12 testing compile errors
build_flags =
    -D BUILD_TESTING=OFF
build_src_filter =
    +<*>
    -<comms/MicroRosNode.cpp>
    -<comms/MicroRosCommandSource.cpp>
    -<comms/MicroRosTelemetryPublisher.cpp>
    -<comms/MicroRosWifiTransport.cpp>
    -<comms/MicroRosSerialTransport.cpp>

; micro-ROS over WiFi. Requires a running micro-ROS agent reachable at
; the IP/port entered over Serial on first boot (see RuntimeConfig.h).
[env:esp32dev_microros]
extends = env

# Fixed typo from "destro" to "distro"
board_microros_distro = jazzy
board_microros_transport = wifi

build_flags =
    -D BUILD_TESTING=OFF
    -D USE_MICRO_ROS
build_src_filter =
    +<*>
    -<comms/SerialCommandSource.cpp>
    -<comms/SerialTelemetryPublisher.cpp>
    -<comms/MicroRosSerialTransport.cpp>
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

; micro-ROS over the USB Serial port (no WiFi/agent IP needed - the agent
; connects directly to this device's serial port). Note: once running,
; this UART is fully owned by the micro-ROS link; any other Serial.print
; calls would corrupt it.
[env:esp32dev_microros_serial]
extends = env

board_microros_distro = jazzy
board_microros_transport = serial

build_flags =
    -D BUILD_TESTING=OFF
    -D USE_MICRO_ROS
build_src_filter =
    +<*>
    -<comms/SerialCommandSource.cpp>
    -<comms/SerialTelemetryPublisher.cpp>
    -<comms/MicroRosWifiTransport.cpp>
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
