; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Plain serial command protocol (cmdL/cmdR over UART). No agent required.
[env:esp32dev_serial]
extends = env

; Bypasses the python 3.12 testing compile errors
build_flags =
    -D BUILD_TESTING=OFF
build_src_filter =
    +<*>
    -<comms/MicroRosNode.cpp>
    -<comms/MicroRosCommandSource.cpp>
    -<comms/MicroRosTelemetryPublisher.cpp>
    -<comms/MicroRosWifiTransport.cpp>
    -<comms/MicroRosSerialTransport.cpp>
    -<motor_only_test.cpp>
    -<imu_only_test.cpp>
    -<motor_velocity_test.cpp>

; Isolated hardware test: drives both motors at full speed for 10s with
; nothing else running (no encoders, no I2C/sensors, no serial parsing).
; Used to rule out software interference when diagnosing "motor doesn't
; physically move" issues.
[env:motor_only_test]
extends = env
build_src_filter =
    -<*>
    +<motor_only_test.cpp>
    +<hal/Motor.cpp>

; Isolated hardware test: reads only the MPU6050 over I2C, nothing else
; running at all (no motors, encoders, current sensor, or serial parsing).
; Intended to be flashed to a separate/dedicated MCU for clean diagnosis,
; away from any other code or wiring that could be a confound.
[env:imu_only_test]
extends = env
build_src_filter =
    -<*>
    +<imu_only_test.cpp>
    +<hal/MPU6050.cpp>
    +<hal/I2CBusRecovery.cpp>

; Isolated hardware test: motors + encoders + computed velocity only.
; No IMU, no current sensor, no micro-ROS - used to verify encoder
; counting and motor velocity independently of the unreliable sensors.
[env:motor_velocity_test]
extends = env
build_src_filter =
    -<*>
    +<motor_velocity_test.cpp>
    +<hal/Motor.cpp>
    +<hal/Encoder.cpp>
    +<control/MotorController.cpp>
    +<control/PID.cpp>

; NOTE: main.cpp is currently wired for plain Serial only (no #ifdef
; branching). The two environments below keep the micro-ROS classes
; (MicroRosNode, transports, etc.) compiling and available in src/comms/
; for whenever main.cpp is rewired to use them again - until then they
; build the same plain-serial behavior as esp32dev_serial.

; micro-ROS over WiFi (classes available, not currently wired into main.cpp).
[env:esp32dev_microros]
extends = env

# Fixed typo from "destro" to "distro"
board_microros_distro = jazzy
board_microros_transport = wifi

build_flags =
    -D BUILD_TESTING=OFF
    -D USE_MICRO_ROS
build_src_filter =
    +<*>
    -<comms/MicroRosSerialTransport.cpp>
    -<motor_only_test.cpp>
    -<imu_only_test.cpp>
    -<motor_velocity_test.cpp>
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

; micro-ROS over USB Serial (classes available, not currently wired into main.cpp).
[env:esp32dev_microros_serial]
extends = env

board_microros_distro = jazzy
board_microros_transport = serial

build_flags =
    -D BUILD_TESTING=OFF
    -D USE_MICRO_ROS
build_src_filter =
    +<*>
    -<comms/MicroRosWifiTransport.cpp>
    -<motor_only_test.cpp>
    -<imu_only_test.cpp>
    -<motor_velocity_test.cpp>
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
