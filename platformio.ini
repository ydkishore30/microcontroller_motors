; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Without this, a plain build/upload (no -e flag) builds every
; environment below, including the two micro-ROS ones that each pull
; in their own library and add ~15s+ apiece. Limit the default target
; to the one actually in use day to day.
[platformio]
default_envs = esp32dev_serial

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    cytrontechnologies/Cytron Motor Drivers Library@^1.0.1

; Plain serial command protocol (cmdL/cmdR over UART). No agent required.
[env:esp32dev_serial]
extends = env

; Bypasses the python 3.12 testing compile errors
build_flags =
    -D BUILD_TESTING=OFF
build_src_filter =
    +<*>
    -<comms/MicroRosNode.cpp>
    -<comms/MicroRosCommandSource.cpp>
    -<comms/MicroRosTelemetryPublisher.cpp>
    -<comms/MicroRosWifiTransport.cpp>
    -<comms/MicroRosSerialTransport.cpp>
    -<motor_only_test.cpp>
    -<imu_only_test.cpp>
    -<motor_velocity_test.cpp>
    -<i2c_scanner_test.cpp>
    -<hardcoded_motor_test.cpp>
    -<raw_pwm_test.cpp>

; Isolated hardware test environments (motor_only_test, imu_only_test,
; motor_velocity_test) are disabled - commented out, not deleted, to
; keep full/default builds fast. The .cpp files are still in src/; to
; re-enable an environment, uncomment its [env:...] block below.
;
; [env:motor_only_test]
; extends = env
; build_src_filter =
;     -<*>
;     +<motor_only_test.cpp>
;     +<hal/Motor.cpp>
;
; [env:imu_only_test]
; extends = env
; build_src_filter =
;     -<*>
;     +<imu_only_test.cpp>
;     +<hal/MPU6050.cpp>
;     +<hal/I2CBusRecovery.cpp>
;
; [env:motor_velocity_test]
; extends = env
; build_src_filter =
;     -<*>
;     +<motor_velocity_test.cpp>
;     +<hal/Motor.cpp>
;     +<hal/Encoder.cpp>
;     +<control/MotorController.cpp>
;     +<control/PID.cpp>

; Isolated diagnostic: scans the full I2C bus, independent of the
; MPU6050/INA226 driver code, to tell apart "bus completely dead" from
; "wrong address"/"one sensor bad". Comment out once done diagnosing.
[env:i2c_scanner_test]
extends = env
build_src_filter =
    -<*>
    +<i2c_scanner_test.cpp>
    +<hal/I2CBusRecovery.cpp>

; Isolated diagnostic: drives both motors at a fixed 0.3 speed from boot,
; no Serial command parsing involved at all. Rules out "commands aren't
; being received" - if motors still don't move, the fault is downstream
; of the ESP32 (driver board, wiring, or motor).
[env:hardcoded_motor_test]
extends = env
build_src_filter =
    -<*>
    +<hardcoded_motor_test.cpp>
    +<hal/Motor.cpp>

; Most minimal possible diagnostic: raw pinMode/digitalWrite/analogWrite,
; no Motor class, no LEDC setup - nothing left in software that could be
; wrong if this doesn't work either.
[env:raw_pwm_test]
extends = env
build_src_filter =
    -<*>
    +<raw_pwm_test.cpp>

; NOTE: main.cpp is currently wired for plain Serial only (no #ifdef
; branching). The two environments below keep the micro-ROS classes
; (MicroRosNode, transports, etc.) compiling and available in src/comms/
; for whenever main.cpp is rewired to use them again - until then they
; build the same plain-serial behavior as esp32dev_serial.

; micro-ROS over WiFi (classes available, not currently wired into main.cpp).
[env:esp32dev_microros]
extends = env

# Fixed typo from "destro" to "distro"
board_microros_distro = jazzy
board_microros_transport = wifi

build_flags =
    -D BUILD_TESTING=OFF
    -D USE_MICRO_ROS
build_src_filter =
    +<*>
    -<comms/MicroRosSerialTransport.cpp>
    -<motor_only_test.cpp>
    -<imu_only_test.cpp>
    -<motor_velocity_test.cpp>
    -<i2c_scanner_test.cpp>
    -<hardcoded_motor_test.cpp>
    -<raw_pwm_test.cpp>
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

; micro-ROS over USB Serial (classes available, not currently wired into main.cpp).
[env:esp32dev_microros_serial]
extends = env

board_microros_distro = jazzy
board_microros_transport = serial

build_flags =
    -D BUILD_TESTING=OFF
    -D USE_MICRO_ROS
build_src_filter =
    +<*>
    -<comms/MicroRosWifiTransport.cpp>
    -<motor_only_test.cpp>
    -<imu_only_test.cpp>
    -<motor_velocity_test.cpp>
    -<i2c_scanner_test.cpp>
    -<hardcoded_motor_test.cpp>
    -<raw_pwm_test.cpp>
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
